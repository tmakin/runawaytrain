<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TUNNEL DMX</title>
<style>
  :root {
    --bg: #0e0e0e;
    --panel: #1a1a1a;
    --border: #2a2a2a;
    --fg: #e8a020;
    --muted: #555;
    --text: #ddd;
    --green: #4ade80;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 8px; max-width: 420px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
  }
  header h1 { margin: 0; font-size: 16px; color: var(--fg); letter-spacing: 2px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.run { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.bo  { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .par {
    aspect-ratio: 1 / 1; border-radius: 50%;
    background: #111; border: 1px solid #222;
    transition: background 80ms, box-shadow 80ms;
  }
  .par.disabled { background: #0a0a0a; border-color: #161616; opacity: 0.3; }
  .par.on { background: var(--fg); box-shadow: 0 0 8px var(--fg); border-color: var(--fg); }
  .patterns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button {
    font-family: inherit; font-size: 13px;
    background: #222; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 6px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
  }
  button:active { transform: scale(0.97); }
  button.sel { background: var(--fg); color: #000; border-color: var(--fg); }
  .slider-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .slider-row label { width: 70px; font-size: 12px; color: #999; text-transform: uppercase; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--fg); }
  .slider-row .val { width: 42px; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  .colors .slider-row label { color: var(--text); }
  .colors .r label { color: #ef4444; }
  .colors .g label { color: #22c55e; }
  .colors .b label { color: #3b82f6; }
  .colors .w label { color: #fff; }
  .transport { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .transport .run-b { background: #14532d; color: #d1fae5; border-color: #166534; }
  .transport .run-b.active { background: var(--green); color: #000; }
  .transport .bo-b.active { background: var(--red); color: #000; border-color: var(--red); }
  .meta { text-align: center; font-size: 11px; color: #777; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>TUNNEL DMX</h1>
  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="dot-label">stopped</span>
  </div>
</header>

<div class="panel">
  <div class="grid" id="grid">
    {% for i in range(max_fixtures) %}<div class="par" data-i="{{ i }}"></div>{% endfor %}
  </div>
</div>

<div class="panel">
  <div class="patterns" id="patterns">
    {% for p in patterns %}<button data-pattern="{{ p }}">{{ p }}</button>{% endfor %}
  </div>
</div>

<div class="panel">
  <div class="slider-row"><label>BPM</label>
    <input type="range" id="bpm" min="10" max="300" step="1">
    <span class="val" id="bpm-v"></span>
  </div>
  <div class="slider-row"><label>Step</label>
    <input type="range" id="step_size" min="1" max="8" step="1">
    <span class="val" id="step_size-v"></span>
  </div>
  <div class="slider-row"><label>Fixtures</label>
    <input type="range" id="fixtures" min="1" max="{{ max_fixtures }}" step="1">
    <span class="val" id="fixtures-v"></span>
  </div>
  <div class="slider-row"><label>Dimmer</label>
    <input type="range" id="dimmer" min="0" max="255" step="1">
    <span class="val" id="dimmer-v"></span>
  </div>
</div>

<div class="panel colors">
  <div class="slider-row r"><label>R</label>
    <input type="range" id="cR" min="0" max="255" step="1">
    <span class="val" id="cR-v"></span>
  </div>
  <div class="slider-row g"><label>G</label>
    <input type="range" id="cG" min="0" max="255" step="1">
    <span class="val" id="cG-v"></span>
  </div>
  <div class="slider-row b"><label>B</label>
    <input type="range" id="cB" min="0" max="255" step="1">
    <span class="val" id="cB-v"></span>
  </div>
  <div class="slider-row w"><label>W</label>
    <input type="range" id="cW" min="0" max="255" step="1">
    <span class="val" id="cW-v"></span>
  </div>
</div>

<div class="panel">
  <div class="transport">
    <button class="run-b" id="b-run">Run</button>
    <button id="b-step">Step</button>
    <button id="b-stop">Stop</button>
    <button class="bo-b" id="b-bo">Black</button>
  </div>
  <div class="meta" id="meta">step 0 / 0</div>
</div>

<script>
const MAX_FIX = {{ max_fixtures }};
let lastStatus = null;
let pendingSet = {};
let setTimer = null;

function postJSON(url, body) {
  return fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {})
  });
}

function flushSet() {
  if (Object.keys(pendingSet).length === 0) return;
  const body = pendingSet;
  pendingSet = {};
  postJSON("/api/set", body).catch(() => {});
}

function queueSet(patch) {
  Object.assign(pendingSet, patch);
  if (setTimer) clearTimeout(setTimer);
  setTimer = setTimeout(flushSet, 150);
}

function $(id) { return document.getElementById(id); }

const sliders = ["bpm", "step_size", "fixtures", "dimmer"];
sliders.forEach(k => {
  const el = $(k);
  el.addEventListener("input", () => {
    $(k + "-v").textContent = el.value;
    queueSet({[k]: parseInt(el.value, 10)});
  });
});

["cR", "cG", "cB", "cW"].forEach(k => {
  const el = $(k);
  el.addEventListener("input", () => {
    $(k + "-v").textContent = el.value;
    const c = [parseInt($("cR").value,10), parseInt($("cG").value,10),
               parseInt($("cB").value,10), parseInt($("cW").value,10)];
    queueSet({color: c});
  });
});

document.querySelectorAll("#patterns button").forEach(b => {
  b.addEventListener("click", () => {
    const p = b.dataset.pattern;
    queueSet({pattern: p});
    flushSet();
  });
});

$("b-run").addEventListener("click", () => { flushSet(); postJSON("/api/run"); });
$("b-stop").addEventListener("click", () => { flushSet(); postJSON("/api/stop"); });
$("b-step").addEventListener("click", () => { flushSet(); postJSON("/api/step"); });
$("b-bo").addEventListener("click", () => { postJSON("/api/blackout"); });

function isDragging(id) {
  return document.activeElement && document.activeElement.id === id;
}

function applyStatus(s) {
  lastStatus = s;
  // header
  const dot = $("dot"), lbl = $("dot-label");
  dot.classList.toggle("run", !!s.running && !s.blackout);
  dot.classList.toggle("bo", !!s.blackout);
  lbl.textContent = s.blackout ? "blackout" : (s.running ? "running" : "stopped");

  // pars
  const active = new Set(s.active || []);
  document.querySelectorAll("#grid .par").forEach(el => {
    const i = parseInt(el.dataset.i, 10);
    el.classList.toggle("disabled", i >= s.fixtures);
    el.classList.toggle("on", active.has(i) && !s.blackout);
  });

  // patterns
  document.querySelectorAll("#patterns button").forEach(b => {
    b.classList.toggle("sel", b.dataset.pattern === s.pattern);
  });

  // sliders
  const setSlider = (id, v) => {
    if (!isDragging(id)) {
      $(id).value = v;
      $(id + "-v").textContent = v;
    }
  };
  setSlider("bpm", s.bpm);
  setSlider("step_size", s.step_size);
  setSlider("fixtures", s.fixtures);
  setSlider("dimmer", s.dimmer);
  setSlider("cR", s.color[0]);
  setSlider("cG", s.color[1]);
  setSlider("cB", s.color[2]);
  setSlider("cW", s.color[3]);

  // transport
  $("b-run").classList.toggle("active", !!s.running);
  $("b-bo").classList.toggle("active", !!s.blackout);

  // meta
  $("meta").textContent = `step ${s.step} / ${s.seq_len}`;
}

async function poll() {
  try {
    const r = await fetch("/api/status");
    if (r.ok) applyStatus(await r.json());
  } catch (e) {}
}
setInterval(poll, 500);
poll();
</script>

</body>
</html>
